[tool.poetry]
name = "devha"
version = "0.1.0"
description = "Developer & Hacking CLI — an ethical hacking and developer toolkit"
authors = ["devha contributors <devha@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/waldex451/devha"
repository = "https://github.com/waldex451/devha"
keywords = ["hacking", "security", "cli", "ethical", "pentesting", "developer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]
packages = [{include = "devha"}]

[tool.poetry.scripts]
devha = "devha.cli:app"

[tool.poetry.dependencies]
python = "^3.10"
typer = {extras = ["all"], version = "^0.12.0"}
rich = "^13.7.0"
httpx = "^0.27.0"
dnspython = "^2.6.0"
beautifulsoup4 = "^4.12.0"
scapy = "^2.5.0"
pyfiglet = "^1.0.2"
textual = "^0.61.0"
click = ">=8.0,<8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
ruff = "^0.4.0"
black = "^24.0.0"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=devha --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
